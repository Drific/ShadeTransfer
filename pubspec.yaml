name: shade_transfer
description: Peer-to-peer encrypted file transfer.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: ^0.55.0
  flutter_webrtc: ^0.12.12
  nfc_manager: ^3.5.1
  file_picker: ^8.3.7
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

msix_config:
  display_name: ShadeTransfer
  publisher_display_name: ShadeTransfer
  identity_name: com.shade.transfer
  msix_version: 0.0.0.1
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
